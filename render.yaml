services:
  - type: web
    name: rum-spa-poc
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: rum-spa-db
          property: connectionString
      - key: ADMIN_TOKEN
        sync: false

databases:
  - name: rum-spa-db
    plan: free
